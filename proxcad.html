<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image" href="icon.png">
     <link rel="stylesheet" href="proxcad.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Endereço e Contato</title>
</head>
<body>
    <div class="login-container">
        <h1>Cadastro</h1>
    <p>Endereço e Contato</p>
    <div class="progress" id="prog" role="progressbar" aria-label="Animated striped example" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100">
  <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 66%"></div>
</div>

    <form class="row g-3">
        <div class="col-md-6">
    <label for="validationServer03" class="form-label">CEP</label>
    <input type="number" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="00.000-00">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>

 <div class="col-6">
    <label for="validationServer03" class="form-label">Logradoura</label>
    <input type="text" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="Preencher">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>

  <div class="col-md-4">
    <label for="inputnum" class="form-label">Número</label>
    <input type="number" class="form-control" id="inputnum" placeholder="00000">
  </div>

    <div class="col-md-4">
    <label for="inputcom" class="form-label">Completo</label>
    <input type="text" class="form-control" id="inputcom" placeholder="Preencher">
  </div>

  <div class="col-md-4">
    <label for="inputcom" class="form-label">Bairro</label>
    <input type="text" class="form-control" id="inputcom" placeholder="Preencher">
  </div>
  
  <div class="col-md-4">
    <label for="inputCity" class="form-label">Cidade</label>
    <input type="text" class="form-control" id="inputCity" placeholder="Ex: São Bento do Sul"> 
  </div>

  <div class="col-md-4">
    <label for="inputState" class="form-label">UF</label>
    <select id="inputState" class="form-select">
      <option selected>SC</option>
      <option>SP</option>
      <option>SE</option>
      <option>ES</option>
      <option>RJ</option>
      <option>MA</option>
      <option>DF</option>
      <option>...</option>
    </select>
  </div>


   <div class="col-md-4">
    <label for="validationServer03" class="form-label">Telefone</label>
    <input type="number" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="00 0000-0000">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>

   <div class="col-md-4">
    <label for="validationServer03" class="form-label">Celular</label>
    <input type="number" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="00 00000-0000">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>

  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Check me out
      </label>
    </div>
  </div>
  <div class="col-12">

     <a href="sen.html">
       <style>
          a
        {
          text-decoration: none;
        }
        </style>
    <button type="button" class="btn btn-success">Próximo</button>
    </a>

<a href="index.html">
     <button type="submit" class="btn btn-danger">Cancelar</button>
</a>
     <a href="cadcan.html">
     <button type="button" class="btn btn-outline-light" id="Voltar">Voltar</button>
     </a>
  </div>
</div>
</form>
</body>
</html>
