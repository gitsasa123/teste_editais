<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image" href="icon.png">
     <link rel="stylesheet" href="cad.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cadastro finalizado</title>

  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #92d29d,#055924);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .success-box {
      background: rgba(255, 255, 255, 0.708);
      padding: 50px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
      animation: aparecer 4s ease;
    }

    .check-icon {
      width: 100px;
      height: 100px;
      background: #198754;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin: 0 auto 20px;
    }

    h1 {
      color: #198754;
      font-weight: bold;
    }

    p {
      color: #555;
      margin-top: 15px;
    }

    .contador {
      font-weight: bold;
      color: #0d6efd;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="success-box">
    <div class="check-icon">
      ✓
    </div>

    <h1>Cadastro Finalizado!</h1>

    <p>
      Seu cadastro foi realizado com sucesso.
    </p>

    <p>
      Você será redirecionado para a página inicial em 
      <span class="contador" id="contador">6</span> segundos...
    </p>

    <a href="index.html" class="btn btn-outline-success">
      Ir agora
    </a>
  </div>

  <script>
    let tempo = 6;
    const contador = document.getElementById("contador");

    const interval = setInterval(() => {
      tempo--;
      contador.textContent = tempo;

      if (tempo <= 0) {
        clearInterval(interval);
        window.location.href = "index.html";
      }
    }, 1000);
  </script>

</body>
</html>
