     <link rel="stylesheet" href="cad.css">

    <title>Senha</title>
</head>
<body>
    <div class="login-container">
        <h1>Senha de acesso</h1>
    <p>Cadatre um email e senha de acesso</p>

    <div class="progress" id="prog" role="progressbar" aria-label="Animated striped example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
  <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
</div>

    <form class="row g-3">
 <div class="col-6">
    <label for="validationServer03" class="form-label">Email</label>
    <input type="email" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="Preencher">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>

  <div class="col-6">
    <label for="validationServer03" class="form-label">Confimar seu email</label>
    <input type="email" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="Preencher">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>

  <div class="col-6">
    <label for="validationServer03" class="form-label">Senha de acesso</label>
    <input type="password" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="Preencher">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>

  <div class="col-6">
    <label for="validationServer03" class="form-label">Confimar seu senha</label>
    <input type="password" class="form-control is-invalid" id="validationServer03" aria-describedby="validationServer03Feedback" required placeholder="Preencher">
    <div id="validationServer03Feedback" class="invalid-feedback">
      Campo Obrigatório.
    </div>
  </div>
 
  <div class="col-12">
    <a href="sucess.html">
       <style>

    <button type="button" class="btn btn-success">Finalizar</button>
    </a>

     <a href="proxcad.html">
     <button type="button" class="btn btn-outline-light" id="Voltar">Voltar</button>
     </a>
  </div>
</div>

</html>
